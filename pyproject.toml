[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cota"
version = "0.1.0"
description = "Daily portfolio, quota and administrator reconciliation for an investment fund, with exact decimal arithmetic."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.8", "mypy>=1.14"]

[tool.setuptools]
packages = ["cota"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["cota", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
